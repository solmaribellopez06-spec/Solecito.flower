<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Solecito Flower</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fffdf7;
      color: #222;
    }

    header {
      background-color: #fff1a8;
      text-align: center;
      padding: 55px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      margin-top: 10px;
      font-size: 17px;
    }

    .catalogo {
      max-width: 900px;
      margin: auto;
      padding: 35px 20px;
    }

    .catalogo h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .categorias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .categoria {
      background: white;
      border-radius: 18px;
      padding: 28px 15px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .categoria:hover {
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>☀️ Solecito Flower</h1>
    <p>Un rayito de sol en forma de flores 🌷</p>
  </header>

  <section class="catalogo">

    <h2>Nuestro catálogo</h2>

    <div class="categorias">

      <div class="categoria">
        🎂
        <h3>Cumpleaños</h3>
      </div>

      <div class="categoria">
        ❤️
        <h3>Aniversario</h3>
      </div>

      <div class="categoria">
        💐
        <h3>Arreglos florales</h3>
      </div>

      <div class="categoria">
        ✨
        <h3>Ofertas</h3>
      </div>

      <div class="categoria">
        🎁
        <h3>Arreglo sorpresa</h3>
      </div>

    </div>

  </section>

  <footer>
    Solecito Flower · Hermosillo, Sonora ☀️
  </footer>

</body>
</html>
